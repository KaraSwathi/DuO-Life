services:
	- type: web
		name: duo-life-sms-webhook
		runtime: node
		rootDir: webhook-server
		plan: free
		buildCommand: npm install
		startCommand: npm start
		healthCheckPath: /health
		autoDeploy: true
		envVars:
			- key: NODE_VERSION
				value: 20
			- key: WEBHOOK_TOKEN
				generateValue: true
			- key: FIREBASE_SERVICE_ACCOUNT_JSON
				sync: false
